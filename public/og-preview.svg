<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Tech Grid Background -->
  <g stroke="rgba(0, 229, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- CyberLife Triangle Emblem -->
  <g transform="translate(600, 210)" filter="url(#glow)">
    <!-- Outer Triangle -->
    <polygon points="0,-110 95,55 -95,55" fill="none" stroke="url(#triGrad)" stroke-width="8"/>
    <!-- Inner Temple LED Light -->
    <circle cx="0" cy="-5" r="24" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="0" cy="-5" r="10" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="600" y="360" font-family="'Orbitron', -apple-system, sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="8">CYBERLIFE</text>
  <text x="600" y="410" font-family="'Rajdhani', -apple-system, sans-serif" font-weight="700" font-size="28" fill="#00e5ff" text-anchor="middle" letter-spacing="6">DETROIT: BECOME HUMAN INTERFACE</text>
  <text x="600" y="460" font-family="monospace" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TEMPLE LED // DIALOGUE WHEEL // CRIME RECONSTRUCTION // FLOWCHART // ZEN GARDEN</text>

  <!-- HUD Corner Brackets -->
  <g stroke="#00e5ff" stroke-width="3" fill="none">
    <path d="M 40 80 L 40 40 L 80 40"/>
    <path d="M 1160 80 L 1160 40 L 1120 40"/>
    <path d="M 40 550 L 40 590 L 80 590"/>
    <path d="M 1160 550 L 1160 590 L 1120 590"/>
  </g>

  <!-- Bottom HUD Status Stamp -->
  <text x="60" y="580" font-family="monospace" font-size="14" fill="#00e5ff">SYSTEM STATUS: 100% OPERATIONAL // NOV 2038</text>
  <text x="1140" y="580" font-family="monospace" font-size="14" fill="#00e5ff" text-anchor="end">PROTOTYPE RK800 #313 248 317</text>
</svg>
